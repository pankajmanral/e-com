# ===========================================================================
# frontend — Next.js 16 (standalone) storefront + resilience dashboard.
# ClusterIP only: the Istio ingressgateway (k8s/istio/gateway.yaml) is the
# public entry point and routes `/` + `/api/*` here, so there is no separate
# LoadBalancer/NodePort Service. During the demo you can also reach it
# directly with `kubectl -n ecommerce port-forward svc/frontend 3000:3000`.
#   kubectl apply -f k8s/frontend.yaml
# ===========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
    app.kubernetes.io/part-of: resilience-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
    version: v1
    app.kubernetes.io/part-of: resilience-lab
spec:
  # Single replica keeps the lab's memory footprint sane on minikube; bump
  # to 2 to see PDB/sidecar effects on the frontend tier too.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
        app.kubernetes.io/part-of: resilience-lab
    spec:
      serviceAccountName: frontend
      terminationGracePeriodSeconds: 20 # let Next.js finish in-flight requests
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ecommerce/web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # Next.js API proxies point at the in-cluster Services (the
            # server-side fetch hops through the mesh thanks to the sidecar).
            - name: SERVICES_USER_URL
              value: http://user-service:4001
            - name: SERVICES_PRODUCT_URL
              value: http://product-service:4002
            - name: SERVICES_ORDER_URL
              value: http://order-service:4003
            - name: SERVICES_OPS_URL
              value: http://ops-service:4004
            # Browser-facing link rendered on order detail pages; users hit
            # Jaeger through the port-forward (scripts/port-forward.ps1).
            - name: JAEGER_URL
              value: http://localhost:16686
          envFrom:
            - configMapRef:
                name: ecommerce-config
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Next.js standalone writes .next cache
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
    app.kubernetes.io/part-of: resilience-lab
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
