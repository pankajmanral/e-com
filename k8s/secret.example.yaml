# ===========================================================================
# EXAMPLE Secret — DO NOT commit a real one.
# k8s/secrets.yaml is git-ignored; copy this file to k8s/secrets.yaml, edit
# the values, then apply THAT file:
#
#   cp k8s/secret.example.yaml k8s/secrets.yaml
#   # edit values...
#   kubectl apply -f k8s/secrets.yaml
#
# For the demo the stack degrades gracefully without it (Grafana falls back
# to the default admin/admin from its own image env), but never ship the
# example values anywhere real. Prefer generating it instead of storing it:
#
#   kubectl -n observability create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 18)"
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: resilience-lab-secrets
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: resilience-lab
type: Opaque
stringData:
  # Grafana admin credentials (mounted into the observability namespace by
  # its own secret in a real setup; kept here as the lab's single example).
  grafana-admin-user: "admin"
  grafana-admin-password: "CHANGE_ME_lab_only"
  # Example API token the ops-service could use if it ever needs to call an
  # external endpoint; unused by default.
  ops-api-token: "CHANGE_ME"
