# ===========================================================================
# Grafana dashboard provider (file provisioning)
# --------------------------------------------------------------------------
# Loads every *.json from /var/lib/grafana/dashboards. Both compose
# (bind-mount) and k8s (ConfigMap mount) put resilience-lab.json there.
# ===========================================================================

apiVersion: 1

providers:
  - name: resilience-lab
    orgId: 1
    folder: Resilience Lab
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
