# ===========================================================================
# Prometheus — Docker Compose scrape config
# --------------------------------------------------------------------------
# Compose-specific: targets use the compose service DNS names
# (user / product / order / ops). The in-cluster variant lives next to this
# file in prometheus.k8s.yml. A production deployment would use the
# Prometheus Operator with pod/service discovery instead of static targets.
#
# Mounted into the prom/prometheus container at /etc/prometheus/prometheus.yml.
# ===========================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: compose

rule_files:
  - /etc/prometheus/rules.yaml

scrape_configs:
  # The four business services all expose the same metric names
  # (http_requests_total, http_request_duration_seconds) with a `service`
  # label, so one job can cover them all.
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - user:4001
          - product:4002
          - order:4003
          - ops:4004

  # The collector's own metrics (prometheus exporter, port 8889) — lets the
  # dashboard prove the observer is healthy too.
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  # Prometheus self-scrape for /-/targets and availability alerts.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
